name: cargo-deny

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/cargo-deny.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/cargo-deny.yml
  # New RustSec advisories show up without any change here.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
